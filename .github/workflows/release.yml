name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  pack-and-publish:
    runs-on: ubuntu-latest
    # id-token: write ist erforderlich, damit der Workflow ein OIDC-Token
    # für NuGet Trusted Publishing anfordern kann.
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build --configuration Release
        env:
          ContinuousIntegrationBuild: true

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Pack
        run: dotnet pack EveryParser/EveryParser.csproj --no-build --configuration Release -o ./artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: nuget
          path: ./artifacts/*.nupkg

      # Trusted Publishing: tauscht das GitHub-OIDC-Token gegen einen
      # kurzlebigen nuget.org API-Key ein (kein NUGET_API_KEY Secret nötig).
      # Erfordert eine passende Policy unter nuget.org -> "Vertrauenswürdige Veröffentlichung".
      - name: NuGet login (trusted publishing)
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push package and symbol package to NuGet.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg" --api-key ${{ steps.nuget-login.nuget_api_key }}
          --source https://api.nuget.org/v3/index.json --skip-duplicate &&
          dotnet nuget push "./artifacts/*.snupkg" --api-key ${{ steps.nuget-login.nuget_api_key }}
          --source https://api.nuget.org/v3/index.json --skip-duplicate
